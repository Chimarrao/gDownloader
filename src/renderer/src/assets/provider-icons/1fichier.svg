<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" role="img" fill="none">
  <title>1fichier</title>
  <!-- Caixa isométrica laranja, marca do 1fichier -->
  <!-- Face superior (mais clara) -->
  <path d="M18 4.5 31.5 11.25 18 18 4.5 11.25Z" fill="#fbc260"/>
  <!-- Face esquerda (tom médio) -->
