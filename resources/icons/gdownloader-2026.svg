<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="gDownloader">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b7cff"/>
      <stop offset="0.55" stop-color="#6a5cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b2559" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- squircle tile -->
  <path fill="url(#tile)" d="M256 24C120 24 24 120 24 256s96 232 232 232 232-96 232-232S392 24 256 24Z" transform="scale(1)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#tile)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#sheen)"/>

  <!-- download glyph: stem + chevron above a tray line -->
  <g filter="url(#soft)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 128 V300" stroke-width="46"/>
    <path d="M176 236 256 316 336 236" stroke-width="46"/>
    <path d="M156 372 H356" stroke-width="46"/>
  </g>
</svg>
